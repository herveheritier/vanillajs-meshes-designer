<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8"/>
        <style>
            #messageBoard {
                width: 99vw;
                height: 99vh;
                background-color: rgba(0, 0, 0, 0);
                color: rgb(55, 194, 0);
                position: absolute;
                top: 0;
                left: 0;
                margin-left: 1vw;
                margin-top: 1vh;
                font-family: monospace;
                pointer-events : none;
            }
            #grid {
                position: absolute;
                left: 10px;
                top: 10px;
            }
            #export {
                position: absolute;
                left: 50px;
                top: 10px;
            }
            #reset {
                position: absolute;
                left: 90px;
                top: 10px;
            }
            #selectAll {
                position: absolute;
                left: 130px;
                top: 10px;
            }
        </style>
    </head>
    <body>
        <button id="grid">#</button>
        <button id="export">↓</button>
        <button id="reset">↻</button>
        <button id="selectAll">☐</button>
        <canvas id="board" width="100" height="100"></canvas>
        <div id="messageBoard"></div>
        <script type="application/javascript" src="./draw.js"></script>
        <script type="application/javascript" src="./main.js"></script>
        <script>doit()</script>
    </body>
</html>
