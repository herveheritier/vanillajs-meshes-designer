<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8"/>
        <style>
            /* ========= Messages console (overlay transparent sur le canvas) ========= */
            #messageBoard {
                width: 99vw;
                height: 99vh;
                background-color: rgba(0, 0, 0, 0);
                color: rgb(55, 194, 0);
                position: absolute;
                top: 0;
                left: 0;
                margin-left: 1vw;
                margin-top: 60px; /* sous la toolbar pour eviter le chevauchement */
                font-family: monospace;
                font-size: 11px;
                line-height: 1.35;
                pointer-events: none;
                opacity: 0.85;
                max-width: 60vw;
            }

            /* ========= Toolbar principale ========= */
            /* Une card flottante qui regroupe tous les boutons de l'app.
               Sections separees par un trait vertical :
               1) canvas (grille, export, reset, select all)
               2) import / export fichiers
               3) navigation entre formes */
            #toolbar {
                position: absolute;
                left: 12px;
                top: 12px;
                z-index: 50;
                display: flex;
                align-items: center;
                gap: 4px;
                padding: 6px 10px;
                background-color: rgba(15, 15, 15, 0.88);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 6px;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
                backdrop-filter: blur(6px);
                user-select: none;
                font-family: monospace;
            }

            /* Boutons partages */
            #toolbar button {
                font-family: monospace;
                font-size: 14px;
                line-height: 1;
                min-width: 32px;
                height: 30px;
                padding: 0 9px;
                background-color: rgba(255, 255, 255, 0.05);
                color: rgb(220, 220, 220);
                border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 3px;
                cursor: pointer;
                transition: background-color 0.12s, border-color 0.12s, color 0.12s, transform 0.06s;
            }
            #toolbar button:hover {
                background-color: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 255, 255, 0.35);
                color: rgb(255, 255, 255);
            }
            #toolbar button:active {
                background-color: rgba(55, 194, 0, 0.18);
                border-color: rgb(55, 194, 0);
                color: rgb(55, 194, 0);
                transform: translateY(1px);
            }
            #toolbar button:focus {
                outline: none;
                border-color: rgb(55, 194, 0);
            }

            /* Separateur fin entre sections (file ops vs shape nav) */
            #toolbar .toolbar-sep {
                display: inline-block;
                width: 1px;
                height: 22px;
                background-color: rgba(255, 255, 255, 0.12);
                margin: 0 6px;
            }

            /* Compteur de forme : pilule verte accent coherent avec le
               theme (meme couleur que la selection edition et le hover
               des boutons de la toolbar). */
            #toolbar #shapeLabel {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                height: 30px;
                padding: 0 12px;
                min-width: 44px;
                font-family: monospace;
                font-size: 13px;
                color: rgb(55, 194, 0);
                background-color: rgba(55, 194, 0, 0.10);
                border: 1px solid rgba(55, 194, 0, 0.35);
                border-radius: 14px;
                pointer-events: none;
                white-space: nowrap;
            }

            /* ========= HUD bas-gauche : coordonnees curseur ========= */
            #coords {
                position: absolute;
                left: 12px;
                bottom: 10px;
                color: rgb(220, 220, 220);
                font-family: monospace;
                font-size: 12px;
                line-height: 1.35;
                pointer-events: none;
                background-color: rgba(15, 15, 15, 0.85);
                padding: 6px 10px;
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 4px;
                z-index: 50;
                white-space: nowrap;
                backdrop-filter: blur(4px);
            }

            /* ========= Modal d'import : remplace la double confirm() native ========= */
            #importModal {
                position: fixed;
                inset: 0;
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: monospace;
                color: rgb(220, 220, 220);
            }
            #importModal[hidden] {
                display: none;
            }
            #importModal .modal-backdrop {
                position: absolute;
                inset: 0;
                background-color: rgba(0, 0, 0, 0.7);
            }
            #importModal .modal-box {
                position: relative;
                background-color: #111;
                border: 1px solid rgba(255, 255, 255, 0.18);
                border-radius: 6px;
                padding: 18px 22px;
                min-width: 380px;
                max-width: 520px;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
                line-height: 1.4;
                font-size: 13px;
            }
            #importModal .modal-title {
                font-size: 14px;
                font-weight: bold;
                color: rgb(55, 194, 0);
                margin-bottom: 10px;
            }
            #importModal .modal-info {
                margin-bottom: 14px;
                font-size: 12px;
                color: rgba(220, 220, 220, 0.85);
                white-space: pre-line;
            }
            #importModal .modal-options {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-bottom: 14px;
            }
            #importModal .modal-options label {
                cursor: pointer;
                display: flex;
                align-items: flex-start;
                gap: 8px;
                padding: 6px 8px;
                border-radius: 3px;
                transition: background-color 0.12s;
            }
            #importModal .modal-options label:hover {
                background-color: rgba(255, 255, 255, 0.06);
            }
            #importModal .modal-options input[type=radio] {
                margin-top: 3px;
                cursor: pointer;
                accent-color: rgb(55, 194, 0);
            }
            #importModal .modal-remember {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 14px;
                font-size: 12px;
                color: rgba(220, 220, 220, 0.85);
                cursor: pointer;
                user-select: none;
            }
            #importModal .modal-remember input[type=checkbox] {
                cursor: pointer;
                accent-color: rgb(55, 194, 0);
            }
            #importModal .modal-buttons {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
            }
            #importModal .modal-buttons button {
                font-family: monospace;
                font-size: 13px;
                padding: 6px 16px;
                cursor: pointer;
                background-color: #222;
                color: #eee;
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 3px;
                transition: background-color 0.12s, border-color 0.12s;
            }
            #importModal .modal-buttons button:hover {
                background-color: #2e2e2e;
                border-color: rgba(255, 255, 255, 0.35);
            }
            #importModal #importModalValidate {
                background-color: rgb(55, 194, 0);
                color: #111;
                border-color: rgb(55, 194, 0);
                font-weight: bold;
            }
            #importModal #importModalValidate:hover {
                background-color: rgb(80, 220, 25);
                border-color: rgb(80, 220, 25);
            }
        </style>
    </head>
    <body>
        <div id="toolbar">
            <button id="grid" title="Afficher / masquer la grille (molette pour ajuster le pas)">#</button>
            <button id="export" title="Telecharger la scene courante en JSON (Ctrl+S)">↓</button>
            <button id="reset" title="Reinitialiser completement la scene (Shift+Backspace)">↻</button>
            <button id="selectAll" title="Selectionner tous les points de la forme active">☐</button>
            <button id="importAlphabet2" title="Importer un fichier alphabet2 (1 ligne = 1 forme)">A</button>
            <button id="importJson" title="Importer une scene JSON (fichier ou drop sur le canvas)">↑</button>
            <span class="toolbar-sep"></span>
            <button id="prevShape" title="Forme precedente">←</button>
            <span id="shapeLabel" title="Forme active / nombre total">1/1</span>
            <button id="nextShape" title="Forme suivante">→</button>
            <button id="newShape" title="Ajouter une nouvelle forme vide">+</button>
            <button id="deleteShape" title="Supprimer la forme active">×</button>
        </div>
        <canvas id="board" width="100" height="100"></canvas>
        <div id="messageBoard"></div>
        <div id="coords"></div>
        <div id="importModal" hidden>
            <div class="modal-backdrop"></div>
            <div class="modal-box">
                <div class="modal-title">Importer une scène</div>
                <div id="importModalInfo" class="modal-info">—</div>
                <div class="modal-options">
                    <label><input type="radio" name="importMode" value="replace" checked> Remplacer la scène courante</label>
                    <label><input type="radio" name="importMode" value="merge"> Fusionner (ajouter aux formes existantes)</label>
                </div>
                <label class="modal-remember"><input type="checkbox" id="importRemember"> Se souvenir de ce choix pour les prochains imports</label>
                <div class="modal-buttons">
                    <button id="importModalCancel" type="button">Annuler</button>
                    <button id="importModalValidate" type="button">Importer</button>
                </div>
            </div>
        </div>
        <script type="application/javascript" src="./draw.js"></script>
        <script type="application/javascript" src="./convert.js"></script>
        <script type="application/javascript" src="./main.js"></script>
        <script>doit()</script>
    </body>
</html>
