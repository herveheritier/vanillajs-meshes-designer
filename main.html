<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8"/>
        <style>
            #messageBoard {
                width: 99vw;
                height: 99vh;
                background-color: rgba(0, 0, 0, 0);
                color: rgb(55, 194, 0);
                position: absolute;
                top: 0;
                left: 0;
                margin-left: 1vw;
                margin-top: 1vh;
                font-family: monospace;
                pointer-events : none;
            }
            #grid {
                position: absolute;
                left: 10px;
                top: 10px;
            }
            #export {
                position: absolute;
                left: 50px;
                top: 10px;
            }
            #reset {
                position: absolute;
                left: 90px;
                top: 10px;
            }
            #selectAll {
                position: absolute;
                left: 130px;
                top: 10px;
            }
            #importAlphabet2 {
                position: absolute;
                left: 170px;
                top: 10px;
            }
            #coords {
                position: absolute;
                left: 10px;
                bottom: 8px;
                color: rgb(220, 220, 220);
                font-family: monospace;
                font-size: 12px;
                pointer-events: none;
                background-color: rgba(0, 0, 0, 0.6);
                padding: 4px 8px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 2px;
                line-height: 1.3;
                z-index: 100;
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <button id="grid">#</button>
        <button id="export">↓</button>
        <button id="reset">↻</button>
        <button id="selectAll">☐</button>
        <button id="importAlphabet2" title="Importer alphabet2">A</button>
        <canvas id="board" width="100" height="100"></canvas>
        <div id="messageBoard"></div>
        <div id="coords"></div>
        <script type="application/javascript" src="./draw.js"></script>
        <script type="application/javascript" src="./convert.js"></script>
        <script type="application/javascript" src="./main.js"></script>
        <script>doit()</script>
    </body>
</html>
